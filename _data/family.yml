# The 42 family, shown in the "42" popover in the masthead and in the footer.
#
# Copied from docs.arc42.org-site/_data/family.yml (meta.arc42.org,
# wiki/concepts/family-menu.md). Same entries, same wording and same order on
# every family site, so the menu reads as one shared component. Order follows
# the work: requirements, then architecture, then agentic engineering built on
# both.
#
# color: req (green), arc (blue) or s42 (both) — see the --family-* tokens.
# here:  set on the entry this site belongs to. faq.arc42.org is part of arc42
#        rather than a sibling of it, so `here_host` names the subsite the
#        reader is actually on, while the link still leads to arc42.org.
#        `here_what` says what that subsite is; docs hard-codes "its
#        documentation" in the include, faq needs its own word.
- name: req42
  host: req42.de
  url: https://req42.de
  color: req
  short: The practical framework for requirements engineering.
- name: arc42
  host: arc42.org
  url: https://arc42.org
  color: arc
  here: true
  here_host: faq.arc42.org
  here_what: its FAQ
  short: The proven template for documenting software architecture.
- name: systems42
  host: systems42.org
  url: https://systems42.org
  color: s42
  short: Agentic engineering based on req42 and arc42.
