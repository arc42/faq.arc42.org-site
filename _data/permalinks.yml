# Permalink manifest — the 136 question URLs that must never change.
#
# ADR-0013/0014 (D13): https://faq.arc42.org/questions/<QID>/ is externally
# cited. Renaming, redirecting or dropping any of these breaks inbound links.
# `.github/workflows/checks.yml` asserts, on every pull request, that the
# built _site contains exactly these 136 pages — no fewer, no extras.
#
# This file is Jekyll data (`site.data.permalinks`), so the list is also
# available to templates if ever needed.
#
# Regenerate only when a question is deliberately added or removed (which
# needs a conscious decision, not a refactor):
#   ls _site/questions | LC_ALL=C sort | sed 's/^/- /'
# and update EXPECTED_COUNT in the workflow to match.
